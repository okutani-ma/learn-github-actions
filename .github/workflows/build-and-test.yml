name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "okutani-ma/learn-github-actions"
      - name: Run linter
        run: |
          npm install
          npm run lint

      - name: Src Directory
        working-directory: ./src
        run: pwd

      - name: Test Directory
        working-directory: ./tests
        run: pwd

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute tests
        run: |
          npm install
          npm test

      - name: Message
        run: echo "Test Finish"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Message
        run: echo "Build Finish"