name: Node.js CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  COLOR: "blue"

jobs:
  test-job:
    runs-on: ubuntu-latest
    env:
      COLOR: "green"
    steps:
      - name: First step
        env:
          COLOR: "red"
        run: echo "Color in step $COLOR"  # 出力: Color in step: red

      - name: Second step
        run: echo "Color in job $COLOR"   # 出力: Color in job: green