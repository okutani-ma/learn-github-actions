name: GitHubActions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.step1.outputs.value }}
    steps:
      - id: step1
        uses: action/example@v1
        with:
          param: "test"

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Use output
        run: echo "Previous job output ${{ needs.job1.outputs.output1 }}"