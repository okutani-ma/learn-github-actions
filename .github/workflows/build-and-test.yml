name: Node.js CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "okutani-ma/learn-github-actions"
      - name: Run linter
        id: step1
        run: |
          npm install
          npm run lint
          echo "version=1.0.0" >> $GITHUB_OUTPUT

      - name: Src Directory
        working-directory: ./src
        run: pwd

      - name: Test Directory
        working-directory: ./tests
        run: pwd

      - name: Use output value
        run: echo "Version is ${{ steps.step1.outputs.version }}"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute tests
        if: github.event_name == 'pull_request'
        run: |
          npm install
          npm test

      - name: Message
        run: echo "Test Finish"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Message
        run: echo "Build Finish"