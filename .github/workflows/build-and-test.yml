name: GitHubActions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  generate-number:
    runs-on: ubuntu-latest
    steps:
      - name: Generate random number
        id: random
        uses: actions/generate-random@v1
        with:
          min: 1
          max: 100

      - name: Use random number
        run: echo "Random number is ${{ steps.random.outputs.number }}"