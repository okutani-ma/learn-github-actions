name: GitHubActions

on:
  push:
    branches:
      - practice-repository

  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: npm run build

      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          name: build-files

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: dist

      - name: Deploy application
        run: |
          cd dist
          ./deploy.sh