name: GitHubActions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.step1.outputs.number }}
    steps:
      - id: step1
        uses: yakubique/random-number@v1.1
        with:
          max: 20
          min: 1

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Use output
        run: echo "Previous job output ${{ needs.job1.outputs.output1 }}"